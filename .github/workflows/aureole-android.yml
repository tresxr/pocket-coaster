name: Aureole Android
on:
  push:
    branches: [main, 'feat/aureole-*']
    paths: ['aureole/**', '.github/workflows/aureole-android.yml']
  pull_request:
    paths: ['aureole/**', '.github/workflows/aureole-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aureole-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.6.3'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android tools
        run: sdkmanager 'platform-tools' 'build-tools;36.0.0' 'platforms;android-36'
      - name: Cache Godot toolchain
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-4.6.3-linux-android-v1
      - name: Install matching editor and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-editor
          install -m 755 "/tmp/godot-editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          curl --fail --location --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Configure export
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 aureole/tools/configure_android.py
      - name: Import project and validate scripts
        working-directory: aureole
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 180 godot --headless --editor --import 2>&1 | tee build/import.log
          python3 tools/check_log.py build/import.log
          timeout 90 godot --headless --audio-driver Dummy -- --smoke-test 2>&1 | tee build/smoke.log
          python3 tools/check_log.py build/smoke.log AUREOLE_SMOKE_TEST_PASS
      - name: Render native hero frame
        working-directory: aureole
        run: |
          set -euo pipefail
          AUREOLE_CAPTURE_PATH="$PWD/build/hero.png" timeout 180 xvfb-run -a godot --audio-driver Dummy --resolution 1200x1000 -- --capture 2>&1 | tee build/render.log
          python3 tools/check_log.py build/render.log AUREOLE_CAPTURE
          test -s build/hero.png
      - name: Export and verify ARM64 debug APK
        working-directory: aureole
        run: |
          set -euo pipefail
          godot --headless --export-debug Android build/aureole-debug.apk 2>&1 | tee build/export.log
          python3 tools/check_log.py build/export.log
          test -s build/aureole-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/aureole-debug.apk | tee build/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/aureole-debug.apk > build/package.txt
          sha256sum build/aureole-debug.apk > build/SHA256SUMS
      - name: Publish installable APK and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: Aureole-Android-debug
          path: |
            aureole/build/aureole-debug.apk
            aureole/build/SHA256SUMS
            aureole/build/hero.png
            aureole/build/*.log
            aureole/build/signature.txt
            aureole/build/package.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Aureole-build-diagnostics
          path: aureole/build/
